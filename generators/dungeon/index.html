<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>地牢生成器 · 中文 TTRPG 地图生成器</title>
<link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../assets/style.css">
<style>
  .dg-wrap {
    max-width: 1200px;
    margin: 0 auto;
    padding: 10px 20px 60px;
    display: grid;
    grid-template-columns: 300px 1fr;
    gap: 20px;
  }
  @media (max-width: 860px) {
    .dg-wrap { grid-template-columns: 1fr; }
  }
  .panel {
    background: var(--panel-bg);
    border: 2px solid var(--line);
    border-radius: 10px;
    padding: 18px;
    box-shadow: 0 6px 16px var(--shadow);
    height: fit-content;
  }
  .panel h2 { margin: 0 0 14px; font-size: 1.1rem; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
  .field { margin-bottom: 14px; }
  .field label { display: flex; justify-content: space-between; font-size: 0.88rem; margin-bottom: 4px; color: var(--ink-soft); }
  .field input[type=range] { width: 100%; }
  .field input[type=text], .field input[type=number] {
    width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px;
    background: #fffaf0; font-family: inherit; font-size: 0.9rem;
  }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
  button {
    flex: 1;
    padding: 10px 12px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font-family: inherit;
    font-size: 0.92rem;
    cursor: pointer;
    transition: background .15s ease;
  }
  button:hover { background: var(--accent-soft); }
  button.secondary { background: #8a7a5c; }
  button.secondary:hover { background: #a6946e; }
  .canvas-panel {
    background: var(--panel-bg);
    border: 2px solid var(--line);
    border-radius: 10px;
    padding: 14px;
    box-shadow: 0 6px 16px var(--shadow);
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  #dungeonCanvas {
    max-width: 100%;
    height: auto;
    background: #1b140d;
    border-radius: 6px;
    border: 1px solid var(--line);
  }
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    margin-top: 12px;
    font-size: 0.82rem;
    color: var(--ink-soft);
  }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; }
  #roomInfo {
    font-size: 0.85rem;
    color: var(--ink-soft);
  }
  #roomInfo div { padding: 4px 0; border-bottom: 1px dashed var(--line); }
  .seed-row { display: flex; gap: 6px; }
  .seed-row input { flex: 1; }
  .seed-row button { flex: none; padding: 6px 10px; }
</style>
</head>
<body>
<div class="site-header">
  <a class="back-link" href="../../index.html">← 返回首页</a>
  <h1>地牢生成器</h1>
  <p>随机生成房间 · 走廊 · 门 · 陷阱与宝藏布局</p>
</div>

<div class="dg-wrap">
  <div class="panel">
    <h2>生成参数</h2>

    <div class="field">
      <label><span>网格宽度</span><span id="valW">50</span></label>
      <input type="range" id="gridW" min="24" max="80" value="50">
    </div>
    <div class="field">
      <label><span>网格高度</span><span id="valH">36</span></label>
      <input type="range" id="gridH" min="18" max="60" value="36">
    </div>
    <div class="field">
      <label><span>房间数量上限</span><span id="valRooms">14</span></label>
      <input type="range" id="roomCount" min="4" max="30" value="14">
    </div>
    <div class="field">
      <label><span>房间最小尺寸</span><span id="valMin">4</span></label>
      <input type="range" id="roomMin" min="3" max="8" value="4">
    </div>
    <div class="field">
      <label><span>房间最大尺寸</span><span id="valMax">9</span></label>
      <input type="range" id="roomMax" min="5" max="16" value="9">
    </div>
    <div class="field">
      <label><span>回路走廊比例（增加环形连接）</span><span id="valLoop">15%</span></label>
      <input type="range" id="loopiness" min="0" max="50" value="15">
    </div>
    <div class="field">
      <label><span>陷阱概率</span><span id="valTrap">12%</span></label>
      <input type="range" id="trapChance" min="0" max="40" value="12">
    </div>
    <div class="field">
      <label><span>宝藏概率</span><span id="valTreasure">18%</span></label>
      <input type="range" id="treasureChance" min="0" max="40" value="18">
    </div>

    <div class="field">
      <label>随机种子（相同种子 = 相同地图）</label>
      <div class="seed-row">
        <input type="text" id="seedInput" placeholder="留空则随机">
        <button class="secondary" id="randomSeedBtn">🎲</button>
      </div>
    </div>

    <div class="btn-row">
      <button id="generateBtn">生成地牢</button>
    </div>
    <div class="btn-row">
      <button class="secondary" id="exportPngBtn">导出 PNG</button>
      <button class="secondary" id="exportTxtBtn">导出清单</button>
    </div>

    <div class="legend">
      <span><i style="background:#d8c79a"></i>地板</span>
      <span><i style="background:#4a3522"></i>墙壁</span>
      <span><i style="background:#8a5a2b"></i>门</span>
      <span><i style="background:#b23a2a"></i>陷阱</span>
      <span><i style="background:#d4af37"></i>宝藏</span>
    </div>
  </div>

  <div class="canvas-panel">
    <canvas id="dungeonCanvas" width="900" height="648"></canvas>
    <p class="scroll-hint" hidden>清单较长，可在框内滚动</p>
    <div id="roomInfo" class="map-list"></div>
  </div>
</div>

<footer>按房间编号对照右侧清单，方便跑团时口述描述 · 本地生成，不上传任何数据</footer>

<script src="../../assets/ui.js"></script>
<script src="dungeon.js"></script>
</body>
</html>
